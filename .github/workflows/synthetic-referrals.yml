name: Generate Synthetic Referrals

on:
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:

jobs:
  create-referral:
    runs-on: ubuntu-latest

    steps:
      - name: Create one synthetic referral
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "X-Ingest-Key: ${{ secrets.SAFEQUEUE_INGEST_KEY }}" \
            "${{ secrets.SAFEQUEUE_API_URL }}/synthetic-referral"
